<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STORE SUPPLY 訪船檢查報告</title>
<style>
:root{--p:#4e73df;--ok:#1cc88a;--bad:#e74a3b;--light:#f8f9fc}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#333;font-family:'Microsoft JhengHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:82px}
.container{max-width:1000px;margin:auto;background:white;min-height:100vh}
header{background:linear-gradient(135deg,#2c3e50,#4ca1af);color:white;text-align:center;padding:30px 18px}
header h1{margin:0;font-size:27px} header p{margin:7px 0 0}
main{padding:15px}.section{border:1px solid #e3e6f0;border-radius:11px;margin-bottom:17px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #0000000b}
summary{list-style:none;padding:16px;color:var(--p);font-weight:800;background:var(--light);cursor:pointer;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}.inside{padding:15px}
.grid{display:grid;grid-template-columns:1fr;gap:15px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}.container{margin:20px auto;border-radius:15px}}
label{font-size:13px;font-weight:700;color:#555}
input,select,textarea{width:100%;padding:11px;border:1px solid #d1d3e2;border-radius:7px;font:inherit;background:white;margin-top:5px}
input.auto{background:#f8f9fc}
.item{border:1px solid #e3e6f0;border-radius:8px;padding:12px;margin-bottom:11px}.item.ok{border-left:5px solid var(--ok)}.item.bad{border-left:5px solid var(--bad)}
.head{display:flex;gap:10px;align-items:flex-start}.q{flex:1;font-weight:650;font-size:14px;line-height:1.5}
.choices{display:flex;gap:5px}.choices button{width:39px;height:39px;border-radius:7px;border:1px solid #d1d3e2;background:white;font-size:20px;font-weight:900}
.choices .active.okb{background:var(--ok);color:white;border-color:var(--ok)}.choices .active.badb{background:var(--bad);color:white;border-color:var(--bad)}
.remark{margin-top:10px}.photo{display:inline-block;margin-top:8px;padding:7px 13px;background:var(--p);color:#fff;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer}.photo input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;display:block}
.delphoto{position:absolute;right:-5px;top:-5px;width:25px;height:25px;border:0;border-radius:50%;background:#e74a3b;color:#fff;font-weight:900;font-size:17px;line-height:25px;padding:0;box-shadow:0 1px 4px #0005}
.progress{background:#fff3cd;padding:13px;border:1px solid #ffeeba;border-radius:9px;margin-bottom:16px}.barbg{height:9px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--ok);width:0}
footer{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 15px;display:flex;gap:10px;box-shadow:0 -2px 10px #0002;z-index:20}
footer button{flex:1;border:0;border-radius:8px;padding:13px;color:#fff;font-weight:800;font-size:14px}.report{background:var(--p)}.excel{background:#217346}.mail{background:#6f42c1}
</style></head>
<body><div class="container"><header><h1>訪船檢查報告</h1><p>STORE SUPPLY · SPD</p></header><main>
<details class="section" open><summary>📋 基本資訊 Basic Information <span>▼</span></summary><div class="inside"><div class="grid">
<div><label>單位 Department</label><input id="dept" class="auto" value="SPD" readonly></div>
<div><label>表單 Form *</label><select id="formType" onchange="render()"><option value="deck">甲板 Deck</option><option value="engine">機艙 Engine</option></select></div>
<div style="grid-column:1/-1"><label>船名 Vessel Name *</label><select id="vessel"><option value="">請選擇船名 Select Vessel...</option></select></div>
<div><label>港口 Port *</label><input id="port"></div><div><label>日期 Date *</label><input id="date" type="date"></div>
<div><label>訪船人員 Inspector *</label><input id="inspector"></div>
</div></div></details>
<div class="progress"><b>填寫進度 <span id="progText">0 / 0</span></b><div class="barbg"><div class="bar" id="bar"></div></div></div>
<div id="checks"></div>
<details class="section"><summary>💬 船員建議或反映事項 <span>▼</span></summary><div class="inside"><textarea id="crew" rows="4"></textarea></div></details>
<details class="section"><summary>📝 訪船人員註記及提醒事項 <span>▼</span></summary><div class="inside"><textarea id="note" rows="4"></textarea></div></details>
</main></div>
<footer><button class="report" onclick="printReport()">Report</button><button class="excel" onclick="exportCSV()">Excel</button><button class="mail" onclick="sendMail()">Email</button></footer>

const formData={
deck:{
"📋 資料準備 Preparation of Documents":["確認安全裝備皆備齊（安全帽、反光背心、安全鞋、及制服）","近一次（半年）物料申請是否有特規或異常項目的問題。","檢閱近一次重大機具調查回報項目。","檢閱近一次 HOUSE KEEPING 檔案。","檢閱近期補給通告、與補給相關 PSC 檢查缺失。"],
"🚢 抵達船邊 Alongside Inspection":["船殼外板油漆狀況。","艏艉纜狀況。","安全網型式與狀況。","FLATRACK 外觀、鎖具箱及鎖具狀況。","船邊供應物料之廠商是否遵守安全規定。"],
"🗂️ 甲板辦公室 Deck Office":["纜繩證書是否齊全？","貨櫃繫固手冊（CSM）保養紀錄是否完整？","物料申請、接收、評鑑流程是否熟悉？","醫藥、海圖申請前是否確實維護 ROB？","是否了解補給通告及相關文件下載方式？","是否了解大型廢棄物料卸岸申請流程？"],
"🏥 醫院／藥房 Hospital / Medical Store":["藥品申請手冊是否為最新版本？","各藥品是否有中英文標示？","取消品項是否已移出藥品櫃？","過期藥品是否額外裝箱並清楚標示？","醫療氧氣瓶數量、壓力及證書效期是否正常？"],

"⚙️ 機艙 Engine Room":["紀錄簿庫存是否正常？","物料申請、接收、評鑑流程是否熟悉？","電瓶收到日期及每週測試紀錄是否完整？","TDS 檢測計、水質化驗工具及 test kit 是否正常？","其他操作／使用上的反饋與建議。"]},

let inspectionData=formData.deck, answers={}, photoStore={};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initVessels(){vessels.forEach(v=>{let o=document.createElement('option');o.value=v[1];o.textContent=`${v[0]} (${v[1]})`;vessel.appendChild(o)})}

function render(){
 inspectionData=formData[formType.value]||formData.deck; answers={}; photoStore={};
 checks.innerHTML=''; let total=0;
 Object.entries(inspectionData).forEach(([area,items],si)=>{
   let d=document.createElement('details');d.className='section';
   d.innerHTML=`<summary>${area} <span>▼</span></summary><div class="inside"></div>`;checks.appendChild(d);
   let box=d.querySelector('.inside');
   items.forEach((q,i)=>{
     total++; let key=area+'|'+q, x=document.createElement('div');x.className='item';x.dataset.key=key;
     x.innerHTML=`<div class="head"><div class="q">${i+1}. ${q}</div><div class="choices"><button type="button" class="okb" onclick="setAns(this,'✓')">✓</button><button type="button" class="badb" onclick="setAns(this,'✕')">✕</button></div></div><input class="remark" placeholder="備註 Remark..."><label class="photo">📷 上傳照片<input type="file" accept="image/*" multiple onchange="preview(this)"></label><div class="thumbs"></div>`;
     box.appendChild(x);
   });
 });
 window.totalItems=total;progress();
}
function setAns(btn,val){let row=btn.closest('.item'),key=row.dataset.key;if(answers[key]===val){delete answers[key];row.classList.remove('ok','bad');row.querySelectorAll('.choices button').forEach(b=>b.classList.remove('active'))}else{answers[key]=val;row.classList.remove('ok','bad');row.classList.add(val==='✓'?'ok':'bad');row.querySelectorAll('.choices button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}progress()}
function progress(){let n=Object.keys(answers).length;progText.textContent=`${n} / ${window.totalItems||0}`;bar.style.width=((n/(window.totalItems||1))*100)+'%'}

function preview(inp){
 const row=inp.closest('.item'), key=row.dataset.key;
 if(!photoStore[key]) photoStore[key]=[];
 [...inp.files].forEach(file=>{
   const r=new FileReader();
   r.onload=e=>{photoStore[key].push(e.target.result); drawPhotos(row,key)};
   r.readAsDataURL(file);
 });
 inp.value='';
}
function drawPhotos(row,key){
 const box=row.querySelector('.thumbs');box.innerHTML='';
 (photoStore[key]||[]).forEach((src,i)=>{
   const w=document.createElement('div');w.className='thumb';
   w.innerHTML=`<img src="${src}"><button type="button" class="delphoto" title="刪除照片">×</button>`;
   w.querySelector('button').onclick=()=>{photoStore[key].splice(i,1);drawPhotos(row,key)};
   box.appendChild(w);
 });
}

function rowsCSV(){
 let rows=[["單位","SPD"],["表單",formType.options[formType.selectedIndex].text],["船名",vessel.options[vessel.selectedIndex]?.text||""],["港口",port.value],["日期",date.value],["訪船人員",inspector.value],[],["區域","檢查項目","結果","備註","照片數"]];
 document.querySelectorAll('.item').forEach(row=>{
   const [area,q]=row.dataset.key.split('|');
   rows.push([area,q,answers[row.dataset.key]||"",row.querySelector('.remark').value,(photoStore[row.dataset.key]||[]).length]);
 });
 rows.push([],["船員建議或反映事項",crew.value],["訪船人員註記及提醒事項",note.value]);
 return '\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
}
function exportCSV(){
 if(!vessel.value)return alert('請先選擇船名');
 let blob=new Blob([rowsCSV()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`${vessel.value}_${date.value||''}_訪船檢查.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function sendMail(){
 if(!vessel.value)return alert('請先選擇船名');
 let sub=encodeURIComponent(`訪船檢查報告 - ${vessel.value} - ${port.value} - ${date.value}`),
 body=encodeURIComponent(`船名：${vessel.options[vessel.selectedIndex].text}\n表單：${formType.options[formType.selectedIndex].text}\n港口：${port.value}\n日期：${date.value}\n訪船人員：${inspector.value}\n\n詳細內容請參閱訪船報告。`);
 location.href=`mailto:?subject=${sub}&body=${body}`;
}
function printReport(){
 if(!vessel.value)return alert('請先選擇船名');
 let sections='';
 document.querySelectorAll('#checks .section').forEach(sec=>{
   let title=sec.querySelector('summary').childNodes[0].textContent.trim(), items='';
   sec.querySelectorAll('.item').forEach((row,i)=>{
     let key=row.dataset.key, q=row.querySelector('.q').textContent, ans=answers[key]||'—', remark=row.querySelector('.remark').value;
     let imgs=(photoStore[key]||[]).map(src=>`<img src="${src}">`).join('');
     items+=`<div class="r"><div class="rq"><b>${esc(q)}</b><span class="${ans==='✓'?'yes':ans==='✕'?'no':''}">${ans}</span></div>${remark?`<div class="remark2"><b>備註：</b>${esc(remark)}</div>`:''}${imgs?`<div class="photos">${imgs}</div>`:''}</div>`;
   });
   sections+=`<section><h2>${esc(title)}</h2>${items}</section>`;
 });
 let w=window.open('','_blank');

 w.document.write(`<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(vessel.value)} 訪船檢查報告</title><style>
