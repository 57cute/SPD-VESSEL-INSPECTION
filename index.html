function render(){inspectionData=formData[formType.value]||formData.deck;answers={};let c=checks,total=0;c.innerHTML='';Object.entries(inspectionData).forEach(([area,items],si)=>{let d=document.createElement('details');d.className='section';d.innerHTML=`<summary>${area} <span>▼</span></summary><div class="inside" id="s${si}"></div>`;c.appendChild(d);let box=d.querySelector('.inside');items.forEach((q,i)=>{total++;let key=area+'|'+q,x=document.createElement('div');x.className='item';x.dataset.key=key;x.innerHTML=`<div class="head"><div class="q">${i+1}. ${q}</div><div class="choices"><button class="okb" onclick="setAns(this,'✓')">✓</button><button class="badb" onclick="setAns(this,'✕')">✕</button></div></div><input class="remark" placeholder="備註 Remark..."><label class="photo">📷 上傳照片<input type="file" accept="image/*" multiple onchange="preview(this)"></label><div class="thumbs"></div>`;box.appendChild(x)})});window.totalItems=total;progress()}
function setAns(btn,val){let row=btn.closest('.item'),key=row.dataset.key;if(answers[key]===val){delete answers[key];row.classList.remove('ok','bad');row.querySelectorAll('button').forEach(b=>b.classList.remove('active'))}else{answers[key]=val;row.classList.remove('ok','bad');row.classList.add(val==='✓'?'ok':'bad');row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}progress()}
function progress(){let n=Object.keys(answers).length;progText.textContent=`${n} / ${window.totalItems||0}`;bar.style.width=((n/(window.totalItems||1))*100)+'%'}
function preview(inp){let b=inp.closest('.item').querySelector('.thumbs');b.innerHTML='';[...inp.files].forEach(f=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.src=e.target.result;b.appendChild(im)};r.readAsDataURL(f)})}
function exportCSV(){if(!vessel.value)return alert('請先選擇船名');let blob=new Blob([rowsCSV()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${vessel.value}_${date.value}_訪船檢查.csv`;a.click()}
function sendMail(){if(!vessel.value)return alert('請先選擇船名');let sub=encodeURIComponent(`訪船檢查報告 - ${vessel.value} - ${port.value} - ${date.value}`),body=encodeURIComponent(`船名：${vessel.options[vessel.selectedIndex].text}\n港口：${port.value}\n日期：${date.value}\n訪船人員：${inspector.value}\n\n詳細內容請參閱訪船報告。`);location.href=`mailto:?subject=${sub}&body=${body}`}
document.addEventListener('DOMContentLoaded',()=>{date.value=new Date().toISOString().slice(0,10);render()});
</script></body></html>
